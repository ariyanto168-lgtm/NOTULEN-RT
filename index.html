<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Notulen & Perencanaan Kegiatan RT v3.5.5</title>
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0ea5e9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Notulen RT">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Framework UI (Bootstrap 5 & Icons) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    :root {
      --primary-color: #0ea5e9;
      --primary-dark: #0284c7;
      --bg-light: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --border-color: #e2e8f0;
    }

    /* PRESET TEMA WARNA APLIKASI */
    [data-theme="emerald"] {
      --primary-color: #10b981;
      --primary-dark: #059669;
    }
    [data-theme="indigo"] {
      --primary-color: #6366f1;
      --primary-dark: #4f46e5;
    }
    [data-theme="sunset"] {
      --primary-color: #f97316;
      --primary-dark: #ea580c;
    }
    [data-theme="dark"] {
      --primary-color: #38bdf8;
      --primary-dark: #0284c7;
      --bg-light: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --border-color: #334155;
    }

    body {
      background-color: var(--bg-light);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding-bottom: 95px;
      user-select: none;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    .bg-primary-custom {
      background-color: var(--primary-color) !important;
    }
    .text-primary-custom {
      color: var(--primary-color) !important;
    }
    
    .btn-primary-custom {
      background-color: var(--primary-color) !important;
      color: #ffffff !important;
      border: none !important;
    }
    .btn-primary-custom:hover, .btn-primary-custom:focus, .btn-primary-custom:active {
      background-color: var(--primary-dark) !important;
      color: #ffffff !important;
    }

    .navbar-brand {
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    
    .app-logo-nav {
      width: 54px;
      height: 54px;
      object-fit: contain;
      border-radius: 14px;
      background: #ffffff;
      padding: 3px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    }

    .card-custom {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.03);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .card-custom:active {
      transform: scale(0.98);
    }
    .icon-badge {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }
    .btn-rounded {
      border-radius: 12px;
      font-weight: 600;
      padding: 10px 16px;
    }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      padding: 8px 0;
      z-index: 1030;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.04);
    }
    .nav-item-btn {
      background: none;
      border: none;
      color: #64748b;
      font-size: 0.72rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      width: 20%;
      transition: color 0.15s ease;
    }
    .nav-item-btn i {
      font-size: 1.35rem;
    }
    .nav-item-btn.active {
      color: var(--primary-color);
      font-weight: 700;
    }
    .install-banner {
      background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
      color: white;
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 16px;
      display: none;
    }
    .badge-status {
      font-size: 0.75rem;
      padding: 5px 12px;
      border-radius: 20px;
    }
    .footer-branding {
      text-align: center;
      padding: 15px 0 5px 0;
      font-size: 0.75rem;
      color: #64748b;
    }

    /* Mode Cetak & PDF */
    @media print {
      .bottom-nav, .navbar, .btn, .no-print, .install-banner, .footer-branding, .modal-header button {
        display: none !important;
      }
      body {
        background: #fff !important;
        color: #000 !important;
        padding: 0 !important;
      }
      .modal {
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: visible !important;
      }
      .modal-dialog {
        max-width: 100% !important;
        width: 100% !important;
        margin: 0 !important;
      }
      .modal-content {
        border: none !important;
        box-shadow: none !important;
        background: #fff !important;
      }
      .modal-body {
        padding: 0 !important;
        overflow: visible !important;
      }
    }
  </style>
</head>
<body>

          <div class="d-flex align-items-center gap-1">
            <span>NOTULEN RT</span>

      </span>
      <div class="d-flex align-items-center gap-2">
        <button id="btn-sync" class="btn btn-sm btn-light rounded-circle shadow-sm" onclick="syncData()" title="Sinkronkan Data">
          <i class="bi bi-arrow-repeat text-primary-custom"></i>
        </button>
        <button class="btn btn-sm btn-light rounded-circle shadow-sm" onclick="logoutApp()" title="Log Out">
          <i class="bi bi-box-arrow-right text-danger"></i>
        </button>
      </div>
    </div>
  </nav>

            <small class="opacity-90" style="font-size:0.7rem;">Agenda</small>
          </div>
        </div>
